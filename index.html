<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name=viewport content="width=device-width, initial-scale=1">
    <style>
        body { margin: 0; padding: 0; }
        html { height: 100%; cursor: default; }
        body {
            font-family: "Roboto", sans-serif; /* Default font */
            width: 100%; height: 100%;
            text-align: center;
            display: table;
            opacity: 1;
            animation: fadein 3s forwards;
        }
        h1 {
            font-size: 2.2em;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        h2 {
            font-weight: 300;
            margin-bottom: 40px;
            color: #666;
        }
        img {
            width: 25%; /* Image width */
            border: 0; /* For IE */
            /* Removed the hardcoded aspect-ratio to prevent the logo from stretching */
            height: auto; 
        }
        #main {
            vertical-align: middle;
            display: table-cell;
            padding: 20px;
        }
        
        /* Contact Section Styling */
        #contact-container {
            margin-top: 30px;
            padding: 20px;
        }
        .contact-label {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 8px;
        }
        .contact-email {
            font-size: 1.4em;
            font-weight: 400;
            color: #00b98b; /* Matching your previous progress bar theme color */
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .contact-email:hover {
            color: #008765; /* Darker green on hover */
            text-decoration: underline;
        }

        /* Fades in animation */
        @keyframes fadein  {
            from { opacity: 0; }
        }

        @media screen and (max-width:600px) {
            img {
                width: 60%;
            }
            h1 {
                font-size: 1.8em;
            }
            h2 {
                margin: 1.1em;
                font-size: 1.1em;
            }
            .contact-email {
                font-size: 1.1em;
            }
        }
    </style>
    <title>Waverly Park Press</title>
</head>
<body>
    <div id="main">
        <img src="wpp-mini-bw.png" alt="Waverly Park Press - mini logo">
        <h1>Waverly Park Press</h1>
        <h2>Our website is currently under construction.</h2>
        
        <div id="contact-container">
            <div class="contact-label">Contact us immediately at:</div>
            <a class="contact-email" href="mailto:info@waverlyparkpress.com">info@waverlyparkpress.com</a>
        </div>
    </div>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</body>
</html>
